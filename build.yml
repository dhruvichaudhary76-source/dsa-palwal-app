name: Build DSA Palwal APK
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.5'
          channel: stable
          cache: true

      - name: Get dependencies
        run: cd dsa-palwal-app && flutter pub get

      - name: Build APK
        run: cd dsa-palwal-app && flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dsa-palwal-apk
          path: dsa-palwal-app/build/app/outputs/flutter-apk/app-release.apk
