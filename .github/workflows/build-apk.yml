name: Build DSA Palwal APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
      - name: Setup Android files
        run: |
          cp lib/main.dart /tmp/m.dart
          cp pubspec.yaml /tmp/p.yaml
          flutter create . --project-name dsa_palwal_app --org com.dsapalwal --platforms=android --overwrite
          cp /tmp/m.dart lib/main.dart
          cp /tmp/p.yaml pubspec.yaml
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: dsa-palwal-apk
          path: build/app/outputs/flutter-apk/app-release.apk
