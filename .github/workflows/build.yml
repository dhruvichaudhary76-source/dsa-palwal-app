name: Build DSA Palwal APK
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.5'
          channel: 'stable'
      - name: Build APK
        run: |
          flutter create --project-name dsa_palwal_app --org com.dsapalwal --platforms=android --overwrite .
          flutter pub add webview_flutter
          echo "import 'package:flutter/material.dart'; import 'package:webview_flutter/webview_flutter.dart'; void main(){runApp(const MyApp());} class MyApp extends StatelessWidget{const MyApp({super.key}); @override Widget build(BuildContext context){return MaterialApp(home: Scaffold(body: SafeArea(child: WebViewWidget(controller: WebViewController()..setJavaScriptMode(JavaScriptMode.unrestricted)..loadRequest(Uri.parse('https://dsapalwal.in'))))));}}" > lib/main.dart
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: dsa-palwal-apk
          path: build/app/outputs/flutter-apk/app-release.apk
