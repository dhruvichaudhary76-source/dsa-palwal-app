name: Build DSA Palwal APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.5'
      - name: Get dependencies
        working-directory: dsa-palwal-app
        run: flutter pub get
      - name: Build APK
        working-directory: dsa-palwal-app
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dsa-palwal-apk
          path: dsa-palwal-app/build/app/outputs/flutter-apk/app-release.apk
