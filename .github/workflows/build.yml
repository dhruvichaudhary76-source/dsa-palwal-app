name: DSA Palwal PRO - All Features
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
      - name: Build PRO APK
        run: |
          cat > pubspec.yaml <<'PUB'
          name: dsa_palwal_app
          description: DSA Palwal PRO - Photo GPS Excel
          version: 1.0.0+2
          environment:
            sdk: '>=3.0.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            shared_preferences: ^2.2.2
            uuid: ^4.3.3
            intl: ^0.19.0
            image_picker: ^1.0.7
            geolocator: ^10.1.0
            path_provider: ^2.1.2
            excel: ^2.1.0
            share_plus: ^7.2.2
            geocoding: ^2.1
          flutter:
            uses-material-design: true
          PUB

          flutter create . --project-name dsa_palwal_app --platforms android --org com.dsapalwal --overwrite

          # Android Permission for Photo + GPS
          cat > android/app/src/main/AndroidManifest.xml <<'MANI'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.CAMERA" />
            <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
            <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
            <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
            <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />
            <application android:label="DSA Palwal PRO" android:name="${applicationName}" android:icon="@mipmap/launcher_icon">
              <activity android:name=".MainActivity" android:exported="true" android:launchMode="singleTop" android:theme="@style/LaunchTheme" android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode" android:hardwareAccelerated="true" android:windowSoftInputMode="adjustResize">
                <meta-data android:name="io.flutter.embedding.android.NormalTheme" android:resource="@style/NormalTheme"/>
                <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
              </activity>
              <meta-data android:name="flutterEmbedding" android:value="2"/>
            </application>
          </manifest>
          MANI

          mkdir -p lib
          cat > lib/main.dart <<'DART'
          import 'dart:convert'; import 'dart:io'; import 'package:flutter/material.dart'; import 'package:shared_preferences/shared_preferences.dart'; import 'package:uuid/uuid.dart'; import 'package:intl/intl.dart'; import 'package:image_picker/image_picker.dart'; import 'package:geolocator/geolocator.dart'; import 'package:path_provider/path_provider.dart'; import 'package:excel/excel.dart'; import 'package:share_plus/share_plus.dart';
