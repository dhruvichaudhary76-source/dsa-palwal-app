name: DSA Palwal PRO - All Features
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'
      - name: Build APK
        run: |
          flutter create . --platforms android --org com.dsapalwal --project-name dsa_palwal_app
          flutter pub get
          flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DSA-Palwal-PRO-APK
          path: build/app/outputs/flutter-apk/app-release.apk
